<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Треугольник</title>
</head>
<body>
    <script>
        alert("Введите числа для 3 сторон треугольника в 3 разных окнах, для определения равнобедренный ли он");
        
        let a = Number(prompt("Введите число для 1 стороны треугольника"));
        let b = Number(prompt("Введите число для 2 стороны треугольника"));
        let c = Number(prompt("Введите число для 3 стороны треугольника"));

        if (isNaN(a) || isNaN(b) || isNaN(c) || a <= 0 || b <= 0 || c <= 0) {
            alert("Введите положительные числа!");
        } 
        if (a + b <= c || a + c <= b || b + c <= a) {
            alert("Треугольник с такими сторонами не существует!");
        } 

        if (a === b || b === c || a === c) {
            alert("Треугольник равнобедренный (равносторонний тоже является равнобедренным)");
        } 

        else {
            alert("Треугольник неравнобедренный (разносторонний)");
        }
    </script>
</body>
</html>
